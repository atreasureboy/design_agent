name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-arch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-arch/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (core → server → mcp → web)
        run: pnpm build
      - name: Unit tests
        run: pnpm -C packages/core test
      - name: E2E smoke (idempotent, isolated temp dirs)
        run: node scripts/smoke.mjs
